services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turnos}
      POSTGRES_USER: ${POSTGRES_USER:-turnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnos-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - turnos_postgres:/var/lib/postgresql/data

  cache:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

volumes:
  turnos_postgres:
