{% extends "base.html" %}{% block content %}<h1>Auditoría</h1><section class="panel"><table><tr><th>Fecha</th><th>Actor</th><th>Acción</th><th>Resultado</th><th>Hash</th></tr>{% for event in events %}<tr><td>{{ event.created_at }}</td><td>{{ event.actor.username|default:"sistema" }}</td><td>{{ event.action }}</td><td>{{ event.result }}</td><td class="muted">{{ event.current_hash|slice:":16" }}…</td></tr>{% endfor %}</table></section>{% endblock %}
